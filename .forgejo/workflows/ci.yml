name: ci

# Forge runs CI and review. Deploy jobs live in .github/workflows and run only on the GitHub
# mirror.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Which parts changed. A change is docs-only only when every path is a root README or lives
  # under docs/ or docs-site/. Everything else runs the application checks; an event with no base
  # to compare against runs every check. `check` always runs: the release's tag gate reads the
  # `ci / check (push)` status and accepts only success.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.plan.outputs.docs_only }}
      app: ${{ steps.plan.outputs.app }}
      sites: ${{ steps.plan.outputs.sites }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          sh scripts/ci-route.test.sh
          sh scripts/ci-route.sh >> "$GITHUB_OUTPUT"

  check:
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
      APP: ${{ needs.changes.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        if: env.APP == 'true'
        with:
          bun-version-file: .bun-version
      - if: env.APP == 'true'
        run: bun install --frozen-lockfile
      - name: Format
        if: env.APP == 'true'
        run: bun run fmt:check
      - name: Typecheck
        if: env.APP == 'true'
        run: bun run typecheck
      - name: Lint
        if: env.APP == 'true'
        run: bun run lint
      - name: Test
        if: env.APP == 'true'
        run: bun run test
      - uses: actions/setup-node@v4
        if: env.DOCS_ONLY == 'true'
        with:
          node-version: 24
      - name: Install docs dependencies
        if: env.DOCS_ONLY == 'true'
        working-directory: docs-site
        run: npm ci
      - name: Check docs
        if: env.DOCS_ONLY == 'true'
        working-directory: docs-site
        run: npm run check
      - name: Build docs
        if: env.DOCS_ONLY == 'true'
        working-directory: docs-site
        run: npm run build

  sites:
    needs: [changes]
    if: needs.changes.outputs.sites == 'true' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          # Astro 7 needs Node 22.23.4 or newer; a runner's cached 22 can be older.
          node-version: 24
      - name: Build the landing page
        working-directory: landing
        run: npm ci && npm run build
      - name: Build the docs site
        working-directory: docs-site
        run: npm ci && npm run check && npm run build

  claude-triage:
    # Shared kit fragment (claude-ci), Forgejo Actions: the last job of the product's CI
    # workflow, because Forgejo has no workflow_run event. Paste it under `jobs:` and list every
    # other job of the workflow in `needs:`; the rest must stay identical to the master.
    # When a pull request's run fails, Claude reads the failed jobs' log tails and posts or
    # updates one comment: likely flaky or likely real, the most likely cause, three lines.
    # Read-only and a no-op until the repository has a CLAUDE_CI_API_KEY secret. It checks out
    # nothing: the script comes from the base branch and the logs through the API. Forks get
    # no secrets and skip. On a GitHub mirror of the product it does nothing.
    needs: [changes, check, sites]
    if: failure() && github.event_name == 'pull_request' && github.server_url != 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Is a key set
        id: gate
        env:
          KEY: ${{ secrets.CLAUDE_CI_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::notice::skipped: no CLAUDE_CI_API_KEY"
            echo "on=false" >> "$GITHUB_OUTPUT"
          else
            echo "on=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch the triage script from the base branch
        id: kit
        if: steps.gate.outputs.on == 'true'
        continue-on-error: true
        env:
          TOKEN: ${{ github.token }}
          API: ${{ github.server_url }}/api/v1
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          code=$(curl -sS -o "$RUNNER_TEMP/claude-ci.mjs" -w '%{http_code}' \
            -H "Authorization: token $TOKEN" \
            "$API/repos/$REPO/raw/.github/claude/claude-ci.mjs?ref=$BASE" || true)
          if [ "$code" = 200 ]; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::skipped: the base branch has no .github/claude/claude-ci.mjs (HTTP $code)"
            echo "on=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Triage
        if: steps.kit.outputs.on == 'true'
        continue-on-error: true
        timeout-minutes: 8
        env:
          CLAUDE_CI_API_KEY: ${{ secrets.CLAUDE_CI_API_KEY }}
          CLAUDE_CI_MODEL: ${{ vars.CLAUDE_CI_MODEL }}
          CLAUDE_CI_BASE_URL: ${{ vars.CLAUDE_CI_BASE_URL }}
          CI_HOST: forgejo
          CI_API_URL: ${{ github.server_url }}/api/v1
          CI_TOKEN: ${{ github.token }}
          CI_REPO: ${{ github.repository }}
          CI_PR: ${{ github.event.pull_request.number }}
          CI_RUN_ID: ${{ github.run_id }}
        run: node "$RUNNER_TEMP/claude-ci.mjs" triage
