name: ci

# Forge runs CI and review. Deploy jobs live in .github/workflows and run only on the GitHub
# mirror.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Which parts changed. A pull request or push that only touches the landing page (landing/,
  # its deploy script or its workflow) runs just the site's build; anything else, a change to the
  # workflows themselves, or an event with no base to compare against runs everything.
  # `check` always runs and skips its steps rather than the job: the release's tag gate reads the
  # `ci / check (push)` status and accepts only success, and a landing-only commit is the code its
  # parent tested.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.plan.outputs.app }}
      landing: ${{ steps.plan.outputs.landing }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=""
          if [ "$EVENT" = pull_request ]; then base="$(git merge-base "$PR_BASE" HEAD 2>/dev/null || true)"; fi
          if [ "$EVENT" = push ] && [ -n "$BEFORE" ] && ! printf %s "$BEFORE" | grep -qE '^0+$'; then base="$BEFORE"; fi
          app=true; landing=true
          if [ -n "$base" ] && files="$(git diff --name-only "$base" HEAD)"; then
            site='^(landing/|scripts/deploy-sites\.sh$|\.github/workflows/sites\.yml$)'
            other="$(printf '%s\n' "$files" | grep -vE "$site" | grep -v '^$' || true)"
            ours="$(printf '%s\n' "$files" | grep -E "$site" || true)"
            [ -z "$other" ] && app=false
            [ -z "$ours" ] && [ "$app" = true ] && landing=false
            printf '%s\n' "$other" | grep -qE '^\.(forgejo|github)/' && { app=true; landing=true; }
          fi
          { echo "app=$app"; echo "landing=$landing"; } >> "$GITHUB_OUTPUT"
          echo "base=${base:-none} app=$app landing=$landing"

  check:
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP: ${{ needs.changes.outputs.app }}
    steps:
      - name: Landing page only
        if: env.APP != 'true'
        run: echo "Only the landing page changed; the service's checks are skipped."
      - uses: actions/checkout@v4
        if: env.APP == 'true'
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        if: env.APP == 'true'
        with:
          bun-version-file: .bun-version
      - if: env.APP == 'true'
        run: bun install --frozen-lockfile
      - name: Format
        if: env.APP == 'true'
        run: bun run fmt:check
      - name: Typecheck
        if: env.APP == 'true'
        run: bun run typecheck
      - name: Lint
        if: env.APP == 'true'
        run: bun run lint
      - name: Test
        if: env.APP == 'true'
        run: bun run test

  landing:
    needs: [changes]
    if: needs.changes.outputs.landing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the landing page
        working-directory: landing
        run: npm ci && npm run build

  claude-triage:
    # Shared kit fragment (claude-ci), Forgejo Actions: the last job of the product's CI
    # workflow, because Forgejo has no workflow_run event. Paste it under `jobs:` and list every
    # other job of the workflow in `needs:`; the rest must stay identical to the master.
    # When a pull request's run fails, Claude reads the failed jobs' log tails and posts or
    # updates one comment: likely flaky or likely real, the most likely cause, three lines.
    # Read-only and a no-op until the repository has a CLAUDE_CI_API_KEY secret. It checks out
    # nothing: the script comes from the base branch and the logs through the API. Forks get
    # no secrets and skip. On a GitHub mirror of the product it does nothing.
    needs: [changes, check, landing]
    if: failure() && github.event_name == 'pull_request' && github.server_url != 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Is a key set
        id: gate
        env:
          KEY: ${{ secrets.CLAUDE_CI_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::notice::skipped: no CLAUDE_CI_API_KEY"
            echo "on=false" >> "$GITHUB_OUTPUT"
          else
            echo "on=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch the triage script from the base branch
        id: kit
        if: steps.gate.outputs.on == 'true'
        continue-on-error: true
        env:
          TOKEN: ${{ github.token }}
          API: ${{ github.server_url }}/api/v1
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          code=$(curl -sS -o "$RUNNER_TEMP/claude-ci.mjs" -w '%{http_code}' \
            -H "Authorization: token $TOKEN" \
            "$API/repos/$REPO/raw/.github/claude/claude-ci.mjs?ref=$BASE" || true)
          if [ "$code" = 200 ]; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::skipped: the base branch has no .github/claude/claude-ci.mjs (HTTP $code)"
            echo "on=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Triage
        if: steps.kit.outputs.on == 'true'
        continue-on-error: true
        timeout-minutes: 8
        env:
          CLAUDE_CI_API_KEY: ${{ secrets.CLAUDE_CI_API_KEY }}
          CLAUDE_CI_MODEL: ${{ vars.CLAUDE_CI_MODEL }}
          CLAUDE_CI_BASE_URL: ${{ vars.CLAUDE_CI_BASE_URL }}
          CI_HOST: forgejo
          CI_API_URL: ${{ github.server_url }}/api/v1
          CI_TOKEN: ${{ github.token }}
          CI_REPO: ${{ github.repository }}
          CI_PR: ${{ github.event.pull_request.number }}
          CI_RUN_ID: ${{ github.run_id }}
        run: node "$RUNNER_TEMP/claude-ci.mjs" triage
