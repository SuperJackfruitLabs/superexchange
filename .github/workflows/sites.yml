name: Deploy public sites
# Deploys superexchange.dev on every merge to main that touches it, with the organisation's
# shared CLOUDFLARE_API_TOKEN secret and CLOUDFLARE_ACCOUNT_ID variable. The websites
# environment only accepts main. Runs on the GitHub mirror only; forge builds the site in CI.
# Run it by hand to redeploy.
on:
  push:
    branches: [main]
    paths:
      - "landing/**"
      - "scripts/deploy-sites.sh"
      - ".github/workflows/sites.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-sites
  cancel-in-progress: false
jobs:
  deploy:
    if: github.server_url == 'https://github.com' && github.ref == 'refs/heads/main'
    environment: websites
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: scripts/deploy-sites.sh landing
